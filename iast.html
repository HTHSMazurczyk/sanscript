---
title: IAST Guide
layout: default

<div class="container-xl pt-2">
  <h1 class="text-center">Letters</h1>
  <div id="guide-table" class="d-flex flex-wrap flex-column gap-2">
    {% for item in site.data.consonants %}
    <div class="p-1 rounded">
      <span class="tahoma"> {{item.iast}} </span>
      <span class="ps-4">{{ item.noUnder }}<ins>{{item.under}}</ins>{{item.noUnder1}}</span>
    </div>
    {% endfor %}
  </div>
