---
title: Flashcards
layout: default
script: flashcards.js
---

<div class="container">
  <div id="practice_box">
    <!-- #front -->
    <div>
      <div id="front_text">FRONT</div>
      <button id="front_audio_btn" class="btn btn-primary">
        <i class="bi bi-volume-down" aria>
          <span class="visually-hidden">Play audio</span>
        </i>
      </button>
      <em id="flip-directive">press<kbd>space</kbd>to flip</em>
    </div>
    <div id="back" style="display: none">
      <hr id="horz_rule" />
      <div id="back_text">BACK</div>
      <button id="back_audio_btn" class="btn btn-primary">
        <i class="bi bi-volume-down" aria>
          <span class="visually-hidden">Play audio</span>
        </i>
      </button>
      <button class="btn btn-primary" id="next_btn">Next</button>
    </div>
  </div>
</div>
