---
title: Flashcards
layout: default
script: flashcards.js
---

<div class="container">
  <div id="practice_box" class="text-center">
    <!-- #front -->
    <div id="front" class="d-flex flex-column">
      <div id="front_text" class="h3">FRONT</div>
      <button id="front_audio_btn" class="btn btn-primary mx-auto">
        <i class="bi bi-volume-down">
          <span class="visually-hidden">Play audio</span>
        </i>
      </button>
      <br />
    </div>
    <div>
      <em id="flip-directive" class="d-block mb-2">press<kbd>space</kbd>to flip</em>
      <hr id="qa-separator" class="my-0" />
    </div>
    <div id="back" class="d-flex flex-column">
      <div id="back_text" class="h3">BACK</div>
      <button id="back_audio_btn" class="btn btn-primary mx-auto">
        <i class="bi bi-volume-down">
          <span class="visually-hidden">Play audio</span>
        </i>
      </button>
      <br />
      <br />
      <div id="next_btns">
        <button class="btn btn-primary me-5" id="incorrect_btn">Again</button>
        <button class="btn btn-primary" id="correct_btn">Good</button>
      </div>
    </div>
  </div>
</div>
