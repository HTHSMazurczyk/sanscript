<nav class="navbar navbar-expand-lg nb-background-color" data-bs-theme="dark">
    <div class="container-fluid">
        <!-- Logo -->
        <a href="index.html" class="navbar-brand">
            <img src="assets/images/logo.png" alt="AirAware Logo" class="d-inline-block align-top">
            <span class="logo">Sanscript</span>
        </a>
        <!--Hamburger Menu Button-->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Rest of the navbar -->
        <div class="collapse navbar-collapse" id="navmenu">
            <!--Links to menu button-->
            <ul class="navbar-nav navbar-menu">
                {% for item in site.data.navbar %}
                <li class="nav-item">
                    <a href="{{ item.link }}" class="nav-link hover-underline-animation nbMenuItem"> {{ item.name }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
