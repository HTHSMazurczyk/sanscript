---
title: Matching
layout: default
<!-- script: matching.js -->
---

<div class="container">
  <div id="practice_box">
    <!-- #prompt -->
    <div>
      <div id="front_text" class="text-center h3">FRONT</div>
      <button id="front_audio_btn" class="btn btn-primary mx-auto d-block">
        <i class="bi bi-volume-down">
          <span class="visually-hidden">Play audio</span>
        </i>
      </button>
    </div>
    <!-- visibility: still renders size -->
    <div id="back">
      <hr id="horz_rule" />
      <div class="row row-cols-2 g-3">
        {% for i in (1..4) %}
        <div class="col">
          <!-- can't have a button inside a button :( -->
          <button class="answer btn btn-outline-tertiary p-3 d-flex align-items-center w-100">
            <kbd>{{forloop.index}}</kbd>
            <span>answer text</span>
            <i class="bi bi-volume-down ms-auto">
              <span class="visually-hidden">Play audio</span>
            </i>
          </button>
        </div>
        {% endfor %}
      </div>
      <button class="btn btn-primary mt-3 d-block ms-auto" id="next_btn">Submit</button>
    </div>
  </div>
</div>
