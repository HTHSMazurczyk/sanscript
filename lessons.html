---
title: Lesson Overview
layout: default
---

<div class="container-lg">
  <h1 class="fw-bold text-center pt-5">Lessons</h1>
  <div class="row row-cols-2">
    {% for item in site.data.lessons %}
    <div class="col">
      <a class="lesson text-reset" href="lesson{{ forloop.index }}.html">
        <div class="circle">{{ forloop.index }}</div>
        <div class="d-inline-block">
          <h2 class="fw-bold">{{ item.name }}</h2>
        </div>
      </a>
    </div>
    {%- endfor -%}
  </div>
</div>
